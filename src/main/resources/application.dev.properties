# ====================================================================
# AML PLATFORM - MULTI-TENANT & BATCH CONFIGURATION
# ====================================================================
server.port=8080

# 1. MASTER DATABASE CONFIGURATION (Default Route)
# Update username/password to match your local PostgreSQL setup
spring.datasource.master.jdbc-url=jdbc:postgresql://localhost:5432/aml_master
spring.datasource.master.username=postgres
spring.datasource.master.password=postgres
spring.datasource.master.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Crucial for 10M records scale)
spring.datasource.master.hikari.maximum-pool-size=20
spring.datasource.master.hikari.minimum-idle=5
spring.datasource.master.hikari.idle-timeout=300000
spring.datasource.master.hikari.connection-timeout=20000

# 2. FLYWAY MIGRATION CONFIGURATION
# We disable default Spring Boot Flyway because we need to manually trigger
# it for the master and dynamically for each tenant during onboarding.
spring.flyway.enabled=false

# 3. JPA / HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Disable Open-in-View to prevent database connection exhaustion
spring.jpa.open-in-view=false

# 4. SPRING BATCH CONFIGURATION
# Let Spring Batch create its own metadata tables in the master DB
spring.batch.jdbc.initialize-schema=always
# Do not auto-run batch jobs on startup; we trigger them via API
spring.batch.job.enabled=false