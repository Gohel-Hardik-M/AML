# ====================================================================
# SHARED APPLICATION CONFIGURATION (Committed to Git)
# ====================================================================
spring.application.name=AML
server.port=8080

# Activate the 'dev' profile (tells Spring to look for application-dev.properties)
spring.profiles.active=dev

# 1. FLYWAY MIGRATION CONFIGURATION
spring.flyway.enabled=false

# 2. JPA / HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# 3. SPRING BATCH CONFIGURATION
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false