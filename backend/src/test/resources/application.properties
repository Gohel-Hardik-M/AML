# ====================================================================
# TEST APPLICATION CONFIGURATION
# ====================================================================
spring.application.name=AML-Test
server.port=0

# In-memory H2 PostgreSQL mode
spring.datasource.url=jdbc:h2:mem:aml_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Test JWT secret (Base64-encoded 256-bit key)
jwt.expiration=3600000
jwt.secret=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==

# Test Mail Configuration
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@aml.local
spring.mail.password=testpassword

# Test AES-256-GCM encryption key (Base64-encoded 32 bytes)
aml.encryption.key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
aml.multitenancy.auto-init=false

app.cors.allowed-origins=http://localhost:4200

# JPA and Flyway
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
