# ====================================================================
# SHARED APPLICATION CONFIGURATION (Committed to Git)
# ====================================================================
spring.application.name=AML
server.port=8080

# Select the profile outside the artifact. No environment profile is forced in production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.secret=${JWT_SECRET}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

aml.encryption.key=${AML_ENCRYPTION_KEY}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# 1. FLYWAY MIGRATION CONFIGURATION
spring.flyway.enabled=false

# 2. JPA / HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB