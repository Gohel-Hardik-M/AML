<div class="min-vh-100 d-flex align-items-center bg-light-subtle"><div class="container"><div class="row justify-content-center"><div class="col-sm-10 col-md-6 col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><h1 class="h4 fw-bold">Set a new password</h1><p class="text-secondary small mb-4">Your account requires a password update before you continue.</p><form (ngSubmit)="submit(formRef)" #formRef="ngForm" novalidate>
<div class="mb-3"><label class="form-label">Current password</label><div class="input-group"><input class="form-control" [class.is-invalid]="currentField.invalid && currentField.touched" [type]="showCurrent ? 'text' : 'password'" name="current" [(ngModel)]="currentPassword" #currentField="ngModel" required maxlength="128"><button class="btn btn-outline-secondary" type="button" (click)="showCurrent = !showCurrent">{{ showCurrent ? 'Hide' : 'Show' }}</button></div><div class="invalid-feedback d-block" *ngIf="currentField.invalid && currentField.touched">Current password is required.</div></div>
<div class="mb-3"><label class="form-label">New password</label><div class="input-group"><input class="form-control" [class.is-invalid]="newField.invalid && newField.touched" [type]="showNew ? 'text' : 'password'" name="next" [(ngModel)]="newPassword" #newField="ngModel" required minlength="10" maxlength="128" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&+=!])\S{10,128}$"><button class="btn btn-outline-secondary" type="button" (click)="showNew = !showNew">{{ showNew ? 'Hide' : 'Show' }}</button></div><div class="invalid-feedback d-block" *ngIf="newField.invalid && newField.touched">Use 10-128 characters with uppercase, lowercase, number, special character, and no spaces.</div></div>
<div class="mb-4"><label class="form-label">Confirm new password</label><div class="input-group"><input class="form-control" [class.is-invalid]="(confirmField.invalid || confirmation !== newPassword) && confirmField.touched" [type]="showConfirmation ? 'text' : 'password'" name="confirm" [(ngModel)]="confirmation" #confirmField="ngModel" required minlength="10" maxlength="128"><button class="btn btn-outline-secondary" type="button" (click)="showConfirmation = !showConfirmation">{{ showConfirmation ? 'Hide' : 'Show' }}</button></div><div class="invalid-feedback d-block" *ngIf="confirmField.touched && (confirmField.invalid || confirmation !== newPassword)">Passwords must match and meet the password requirements.</div></div>
<button class="btn btn-primary w-100" [disabled]="formRef.invalid || confirmation !== newPassword">Update password</button></form></div></div></div></div></div></div>
